<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description"
    content="Contact Crazy Rafting to book a trip or ask a question. Find our address, phone number, email, and location map, plus a contact form.">
  <meta name="author" content="Marcos da Silva">
  <link rel="stylesheet" href="styles/rafting.css">
  <title>Contact Us - Crazy Rafting</title>
</head>

<body>
  <header>
    <img class="logo" src="images/z-boat.png" alt="Logo">
    <nav>
      <ul class="navigation">
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About Us</a></li>
        <li><a href="trips.html">Trips</a></li>
        <li><a href="contact.html">Contact Us</a></li>
      </ul>
    </nav>
  </header>
  <main>
    <h1 class="page-title">Contact Us</h1>
    <section class="contact-info">
      <address>
        Crazy Rafting<br>
        Av. das Corredeiras, 123<br>
        Brotas, São Paulo - 18350-000<br>
        Phone: <a href="tel:+5514999999999">+55 14 99999-9999</a><br>
        Email: <a href="mailto:contato@crazyrafting.com.br">contato@crazyrafting.com.br</a>
      </address>
    </section>

    <section class="contact-grid">
      <iframe class="map" title="Crazy Rafting location map"
        src="https://www.google.com/maps?q=Brotas,+São+Paulo,+Brasil&output=embed" width="400" height="300"
        loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>

      <form class="contact-form" action="#" method="post">
        <label for="name">Name</label>
        <input type="text" id="name" name="name" required>

        <label for="email">Email</label>
        <input type="email" id="email" name="email" required>

        <fieldset>
          <legend>Message Purpose</legend>
          <label><input type="radio" name="purpose" value="general" checked> General Inquiry</label>
          <label><input type="radio" name="purpose" value="reservation"> Reservation Question</label>
          <label><input type="radio" name="purpose" value="suggestion"> Website Suggestion</label>
        </fieldset>

        <label for="message">Message</label>
        <textarea id="message" name="message" rows="5"></textarea>

        <label class="checkbox-label">
          <input type="checkbox" name="newsletter"> Please subscribe me to the monthly newsletter
        </label>

        <button type="submit">Get in Touch!</button>
      </form>
    </section>

    <section>
      <h2>We Are Here to Serve You</h2>
      <div class="employee-gallery">
        <figure>
          <img src="images/employee.jpg" alt="River guide">
          <figcaption>River Guide</figcaption>
        </figure>
        <figure>
          <img src="images/employee.jpg" alt="Trip coordinator">
          <figcaption>Trip Coordinator</figcaption>
        </figure>
        <figure>
          <img src="images/employee.jpg" alt="Safety officer">
          <figcaption>Safety Officer</figcaption>
        </figure>
      </div>
    </section>
  </main>
  <footer>
    <p>© 2026 | Crazy Rafting | Marcos E. da Silva</p>
    <nav class="socialmedia">
      <a href="https://facebook.com">
        <img src="images/facebook.png" alt="Facebook Icon">
      </a>
      <a href="https://linkedin.com">
        <img src="images/linkedin.png" alt="LinkedIn Icon">
      </a>
      <a href="https://instagram.com">
        <img src="images/instagram.png" alt="Instagram Icon">
      </a>
    </nav>
  </footer>
</body>

</html>
