<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML and CSS Quiz</title>
    <link rel="stylesheet" href="styles/quiz.css">
</head>

<body>
    <h1>Basic HTML and CSS Quiz</h1>

    <form action="#" method="get">
        <div class="question">
            <label for="q1">1. What does the acronym HTML stand for?</label>
            <input type="text" name="q1" id="q1">
        </div>

        <div class="question">
            <label for="q2">2. Explain the difference between the id and class attributes.</label>
            <textarea name="q2" id="q2" rows="4"></textarea>
        </div>

        <div class="question">
            <label for="q3">3. Which of the following is the correct syntax for a CSS comment?</label>
            <select name="q3" id="q3">
                <option value="" selected disabled>Choose One ...</option>
                <option value="a">/* comment */</option>
                <option value="b">// comment</option>
                <option value="c">&lt;!-- comment --&gt;</option>
                <option value="d"># comment</option>
            </select>
        </div>

        <div class="question">
            <label for="q4">4. Given the declaration <code>padding: 10px 20px 30px 40px;</code>, what is the top
                padding value in pixels?</label>
            <input type="number" name="q4" id="q4">
        </div>

        <button type="submit">Submit Quiz</button>
    </form>
</body>

</html>
